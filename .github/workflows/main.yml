name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack Android project bundle
        run: |
          B64_FILE=""
          if [ -f "android_project.b64" ]; then
            B64_FILE="android_project.b64"
          elif [ -f "DualCam_Poprawione_v8/android_project.b64" ]; then
            B64_FILE="DualCam_Poprawione_v8/android_project.b64"
          elif [ -f "DualCam_APK_Gotowe/android_project.b64" ]; then
            B64_FILE="DualCam_APK_Gotowe/android_project.b64"
          elif [ -f "DualCam_Android_APK/android_project.b64" ]; then
            B64_FILE="DualCam_Android_APK/android_project.b64"
          elif [ -f "DualCam_Poprawione/android_project.b64" ]; then
            B64_FILE="DualCam_Poprawione/android_project.b64"
          elif [ -f "Pliki_Bez_Folderow/android_project.b64" ]; then
            B64_FILE="Pliki_Bez_Folderow/android_project.b64"
          fi
          if [ -n "$B64_FILE" ]; then
            mkdir -p android_build
            base64 -d "$B64_FILE" > /tmp/proj.zip
            unzip -q /tmp/proj.zip -d android_build
            echo "PROJ_DIR=android_build" >> "$GITHUB_ENV"
          else
            echo "PROJ_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: gradle --project-dir "${{ env.PROJ_DIR }}" assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualCamRecorder-APK
          path: "${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
